name: Release Dry Run

on:
  workflow_dispatch:

jobs:
  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: template/package.json

      - name: Install template dependencies
        working-directory: template
        run: npm install

      - name: Build template with webpack path
        working-directory: template
        run: npm run build

      - name: Build template with vite path
        working-directory: template
        run: npm run build:vite