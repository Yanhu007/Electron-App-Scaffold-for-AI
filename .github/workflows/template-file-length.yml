name: Template File Length

on:
  pull_request:
    branches: ['**']
    paths:
      - 'template/**'
      - '.github/workflows/template-file-length.yml'

jobs:
  template-file-length:
    name: Template File Length
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: template/package-lock.json

      - name: Install template dependencies
        working-directory: template
        run: npm install

      - name: Check file length policy
        working-directory: template
        run: npm run check:file-length