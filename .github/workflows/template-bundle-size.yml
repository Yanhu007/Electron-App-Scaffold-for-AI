name: Template Bundle Size

on:
  pull_request:
    branches: ['**']
    paths:
      - 'template/**'
      - '.github/workflows/template-bundle-size.yml'

jobs:
  template-bundle-size:
    name: Template Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: template/package-lock.json

      - name: Install template dependencies
        working-directory: template
        run: npm install

      - name: Build template
        working-directory: template
        run: npm run build

      - name: Check bundle size
        working-directory: template
        run: npm run check:bundle-size